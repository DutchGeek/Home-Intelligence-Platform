script:
  hip_notify_doorbell:
    alias: HIP Doorbell Notification
    mode: queued
    fields:
      event_id:
        required: false
      contract_version:
        required: false
      event_type:
        required: false
      source:
        required: false
      message:
        required: false
      occurred_at:
        required: false
      lifecycle:
        required: false
      camera:
        required: false
      person:
        required: false
      timestamp:
        required: false
      snapshot:
        required: false
      artifact_path:
        required: false
      artifact_public_path:
        required: false
    sequence:
      - variables:
          resolved_snapshot: >-
            {{ snapshot | default(artifact_public_path, true) | default('/local/snapshots/front_door_latest.jpg', true) }}
          resolved_person: >-
            {{ person | default('Someone', true) }}
          resolved_camera: >-
            {{ camera | default('Front Door', true) }}
      - action: "{{ states('input_text.hip_registry_mobile_notify_service') }}"
        data:
          title: HIP Visitor Alert
          message: >-
            {{ resolved_person }} is at {{ resolved_camera }}.
          data:
            push:
              sound: default
            image: "{{ resolved_snapshot }}"
