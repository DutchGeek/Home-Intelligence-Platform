script:
  hip_capture_snapshot:
    alias: HIP Capture Snapshot
    mode: queued
    fields:
      event_id:
        required: false
      contract_version:
        required: false
      event_type:
        required: false
      source:
        required: false
      message:
        required: false
      occurred_at:
        required: false
      artifact_path:
        required: false
      artifact_public_path:
        required: false
      camera_entity:
        required: false
      snapshot_file:
        required: false
    sequence:
      - variables:
          resolved_camera_entity: >-
            {{ camera_entity | default(states('input_text.hip_front_door_camera'), true) }}
          resolved_snapshot_file: >-
            {{ snapshot_file | default(artifact_path, true) | default('/config/www/snapshots/front_door_latest.jpg', true) }}
      - condition: template
        value_template: "{{ resolved_camera_entity is string and resolved_camera_entity.startswith('camera.') }}"
      - action: camera.snapshot
        data:
          entity_id: "{{ resolved_camera_entity }}"
          filename: "{{ resolved_snapshot_file }}"
