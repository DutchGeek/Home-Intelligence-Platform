script:
  hip_homepod_announce:
    alias: HIP HomePod Announcement
    mode: queued
    fields:
      event_id:
        required: false
      contract_version:
        required: false
      event_type:
        required: false
      source:
        required: false
      message:
        required: false
      occurred_at:
        required: false
      lifecycle:
        required: false
      camera:
        required: false
      person:
        required: false
      timestamp:
        required: false
      snapshot:
        required: false
      artifact_path:
        required: false
      artifact_public_path:
        required: false
    sequence:
      - variables:
          resolved_camera: >-
            {{ camera | default('front door', true) }}
          resolved_person: >-
            {{ person | default('', true) }}
      - action: tts.speak
        target:
          entity_id: "{{ states('input_text.hip_registry_piper_tts_entity') }}"
        data:
          media_player_entity_id: "{{ states('input_text.hip_registry_homepod_player_entity') }}"
          message: >-
            {% if resolved_person != '' and resolved_person != 'Unknown' %}
              {{ resolved_person }} is at the {{ resolved_camera }}.
            {% else %}
              Someone is at the {{ resolved_camera }}.
            {% endif %}
