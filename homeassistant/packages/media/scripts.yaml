script:
  hip_homepod_announce:
    alias: HIP HomePod Announcement
    mode: queued
    fields:
      event_id:
        required: false
      contract_version:
        required: false
      event_type:
        required: false
      source:
        required: false
      message:
        required: false
      occurred_at:
        required: false
      lifecycle:
        required: false
      artifact_path:
        required: false
      artifact_public_path:
        required: false
    sequence:
      - action: tts.speak
        target:
          entity_id: tts.piper
        data:
          media_player_entity_id: media_player.living_room_homepod
          message: >-
            {{ message | default('Attention. There is someone at the front door.', true) }}
