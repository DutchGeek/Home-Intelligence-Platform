script:
  hip_event_manager:
    alias: HIP Event Manager
    mode: queued
    fields:
      contract_version:
        required: false
      event_type:
        required: false
      source:
        required: false
      message:
        required: false
      occurred_at:
        required: false
      event_id:
        required: false
      artifact_path:
        required: false
      artifact_public_path:
        required: false
    sequence:
      - variables:
          resolved_last_event_entity: >-
            {{ states('input_text.hip_registry_last_event_entity') }}
          resolved_last_event_id_entity: >-
            {{ states('input_text.hip_registry_last_event_id_entity') }}
          resolved_last_event_type_entity: >-
            {{ states('input_text.hip_registry_last_event_type_entity') }}
          resolved_last_event_source_entity: >-
            {{ states('input_text.hip_registry_last_event_source_entity') }}
          resolved_last_event_contract_version_entity: >-
            {{ states('input_text.hip_registry_last_event_contract_version_entity') }}
          resolved_last_event_lifecycle_entity: >-
            {{ states('input_text.hip_registry_last_event_lifecycle_entity') }}
          resolved_last_event_artifact_entity: >-
            {{ states('input_text.hip_registry_last_event_artifact_entity') }}
          resolved_last_event_artifact_public_entity: >-
            {{ states('input_text.hip_registry_last_event_artifact_public_entity') }}
          resolved_last_event_at_entity: >-
            {{ states('input_datetime.hip_registry_last_event_at_entity') }}
          resolved_event_history_entity: >-
            {{ states('input_text.hip_registry_event_history_entity') }}
          resolved_event_total_entity: >-
            {{ states('input_number.hip_registry_event_total_entity') }}
          resolved_snapshot_artifact_path_entity: >-
            {{ states('input_text.hip_registry_snapshot_artifact_path_entity') }}
          resolved_snapshot_public_path_entity: >-
            {{ states('input_text.hip_registry_snapshot_public_path_entity') }}
          resolved_artifact_retention_policy_entity: >-
            {{ states('input_text.hip_registry_artifact_retention_policy_entity') }}
          resolved_contract_version: >-
            {{ contract_version | default(states(resolved_last_event_contract_version_entity), true) | default('hip.event.v1', true) }}
          resolved_event_type: >-
            {{ event_type | default('doorbell_pressed', true) }}
          resolved_source: >-
            {{ source | default('security.front_door', true) }}
          resolved_camera_name: >-
            {{ 'Front Door' if resolved_source == 'security.front_door' else resolved_source }}
          resolved_message: >-
            {{ message | default('Someone is at the front door.', true) }}
          resolved_occurred_at: >-
            {{ occurred_at | default(now().strftime('%Y-%m-%dT%H:%M:%S%z'), true) }}
          resolved_event_id: >-
            {{ event_id | default('hip-' ~ now().strftime('%Y%m%d%H%M%S%f'), true) }}
          resolved_artifact_path: >-
            {{ '/config/www/snapshots/history/' ~ resolved_event_id ~ '.jpg' }}
          resolved_artifact_public_path: >-
            {{ '/local/snapshots/history/' ~ resolved_event_id ~ '.jpg' }}
          resolved_history_artifact_path: >-
            {{ '/config/www/snapshots/history/' ~ resolved_event_id ~ '.jpg' }}
          resolved_history_artifact_public_path: >-
            {{ '/local/snapshots/history/' ~ resolved_event_id ~ '.jpg' }}
      - action: hip.visitor_create
        data:
          event_id: "{{ resolved_event_id }}"
          type: visitor
          status: new
          camera: "{{ resolved_camera_name }}"
          timestamp: "{{ resolved_occurred_at }}"
          person: null
          snapshot: null
          confidence: null
          notification_sent: false
          announcement_sent: false
          timeline_append: "{{ now().strftime('%H:%M') }} Doorbell pressed"
        response_variable: visitor_create_result
      - condition: template
        value_template: "{{ visitor_create_result.ok | default(false) }}"
      - action: script.hip_event_persist
        data:
          event_id: "{{ resolved_event_id }}"
          contract_version: "{{ resolved_contract_version }}"
          event_type: "{{ resolved_event_type }}"
          source: "{{ resolved_source }}"
          message: "{{ resolved_message }}"
          occurred_at: "{{ resolved_occurred_at }}"
          lifecycle: accepted
          artifact_path: "{{ resolved_artifact_path }}"
          artifact_public_path: "{{ resolved_artifact_public_path }}"
      - event: hip_doorbell_pressed
        event_data:
          event_id: "{{ resolved_event_id }}"
          contract_version: "{{ resolved_contract_version }}"
          event_type: "{{ resolved_event_type }}"
          source: "{{ resolved_source }}"
          message: "{{ resolved_message }}"
          occurred_at: "{{ resolved_occurred_at }}"
          lifecycle: accepted
          artifact_path: "{{ resolved_artifact_path }}"
          artifact_public_path: "{{ resolved_artifact_public_path }}"
      - action: script.hip_artifact_manager
        data:
          event_id: "{{ resolved_event_id }}"
          event_type: "{{ resolved_event_type }}"
          artifact_path: "{{ resolved_artifact_path }}"
          artifact_public_path: "{{ resolved_artifact_public_path }}"
      - action: script.hip_capture_snapshot
        data:
          event_id: "{{ resolved_event_id }}"
          contract_version: "{{ resolved_contract_version }}"
          event_type: "{{ resolved_event_type }}"
          source: "{{ resolved_source }}"
          message: "{{ resolved_message }}"
          occurred_at: "{{ resolved_occurred_at }}"
          artifact_path: "{{ resolved_artifact_path }}"
          artifact_public_path: "{{ resolved_artifact_public_path }}"
          snapshot_file: "{{ resolved_artifact_path }}"
          history_snapshot_file: "{{ resolved_history_artifact_path }}"
      - action: hip.visitor_update
        data:
          event_id: "{{ resolved_event_id }}"
          status: snapshot_captured
          snapshot: "{{ resolved_history_artifact_public_path }}"
          timeline_append: "{{ now().strftime('%H:%M') }} Snapshot captured"
        response_variable: visitor_snapshot_result
      - action: script.hip_event_persist
        data:
          event_id: "{{ resolved_event_id }}"
          contract_version: "{{ resolved_contract_version }}"
          event_type: "{{ resolved_event_type }}"
          source: "{{ resolved_source }}"
          message: "{{ resolved_message }}"
          occurred_at: "{{ resolved_occurred_at }}"
          lifecycle: artifact_captured
          artifact_path: "{{ resolved_artifact_path }}"
          artifact_public_path: "{{ resolved_artifact_public_path }}"
      - action: script.hip_event_dispatch
        data:
          event_id: "{{ resolved_event_id }}"
          contract_version: "{{ resolved_contract_version }}"
          event_type: "{{ resolved_event_type }}"
          source: "{{ resolved_source }}"
          message: "{{ resolved_message }}"
          occurred_at: "{{ resolved_occurred_at }}"
          lifecycle: dispatched
          camera: "{{ resolved_camera_name }}"
          person: null
          timestamp: "{{ resolved_occurred_at }}"
          artifact_path: "{{ resolved_artifact_path }}"
          artifact_public_path: "{{ resolved_history_artifact_public_path }}"
      - action: hip.visitor_update
        data:
          event_id: "{{ resolved_event_id }}"
          status: completed
          notification_sent: true
          announcement_sent: true
          timeline_append: "{{ now().strftime('%H:%M') }} Notification sent"
        response_variable: visitor_notification_result
      - action: hip.visitor_update
        data:
          event_id: "{{ resolved_event_id }}"
          timeline_append: "{{ now().strftime('%H:%M') }} HomePod announced"
      - action: script.hip_event_persist
        data:
          event_id: "{{ resolved_event_id }}"
          contract_version: "{{ resolved_contract_version }}"
          event_type: "{{ resolved_event_type }}"
          source: "{{ resolved_source }}"
          message: "{{ resolved_message }}"
          occurred_at: "{{ resolved_occurred_at }}"
          lifecycle: completed
          artifact_path: "{{ resolved_artifact_path }}"
          artifact_public_path: "{{ resolved_history_artifact_public_path }}"
      - action: script.hip_record_visitor_event
        data:
          event_id: "{{ resolved_event_id }}"
          increment_daily: true

  hip_event_persist:
    alias: HIP Event Persistence
    mode: queued
    fields:
      event_id:
        required: true
      contract_version:
        required: true
      event_type:
        required: true
      source:
        required: true
      message:
        required: true
      occurred_at:
        required: true
      lifecycle:
        required: true
      artifact_path:
        required: false
      artifact_public_path:
        required: false
    sequence:
      - action: input_text.set_value
        target:
          entity_id: "{{ states('input_text.hip_registry_last_event_entity') }}"
        data:
          value: "{{ message }}"
      - action: input_text.set_value
        target:
          entity_id: "{{ states('input_text.hip_registry_last_event_id_entity') }}"
        data:
          value: "{{ event_id }}"
      - action: input_text.set_value
        target:
          entity_id: "{{ states('input_text.hip_registry_last_event_type_entity') }}"
        data:
          value: "{{ event_type }}"
      - action: input_text.set_value
        target:
          entity_id: "{{ states('input_text.hip_registry_last_event_source_entity') }}"
        data:
          value: "{{ source }}"
      - action: input_text.set_value
        target:
          entity_id: "{{ states('input_text.hip_registry_last_event_contract_version_entity') }}"
        data:
          value: "{{ contract_version }}"
      - action: input_text.set_value
        target:
          entity_id: "{{ states('input_text.hip_registry_last_event_lifecycle_entity') }}"
        data:
          value: "{{ lifecycle }}"
      - action: input_text.set_value
        target:
          entity_id: "{{ states('input_text.hip_registry_last_event_artifact_entity') }}"
        data:
          value: "{{ artifact_path | default('', true) }}"
      - action: input_text.set_value
        target:
          entity_id: "{{ states('input_text.hip_registry_last_event_artifact_public_entity') }}"
        data:
          value: "{{ artifact_public_path | default('', true) }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: "{{ states('input_text.hip_registry_last_event_at_entity') }}"
        data:
          datetime: "{{ occurred_at }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ lifecycle == 'completed' }}"
            sequence:
              - variables:
                  resolved_event_history_entry: >-
                    {{ occurred_at }} | {{ event_type }} | {{ source }} | {{ message }}
                  resolved_event_history: >-
                    {{ ([resolved_event_history_entry] + (states(resolved_event_history_entity).split('\n') if states(resolved_event_history_entity) not in ['unknown', 'unavailable', ''] else []))[:5] | join('\n') }}
                  resolved_event_total: >-
                    {{ states(resolved_event_total_entity) | float(0) + 1 }}
              - action: input_text.set_value
                target:
                  entity_id: "{{ resolved_event_history_entity }}"
                data:
                  value: "{{ resolved_event_history }}"
              - action: input_number.set_value
                target:
                  entity_id: "{{ resolved_event_total_entity }}"
                data:
                  value: "{{ resolved_event_total }}"

  hip_artifact_manager:
    alias: HIP Artifact Manager
    mode: queued
    fields:
      event_id:
        required: false
      event_type:
        required: false
      artifact_path:
        required: false
      artifact_public_path:
        required: false
    sequence:
      - action: script.hip_retention_policy
        data:
          artifact_path: "{{ artifact_path | default(states(states('input_text.hip_registry_snapshot_artifact_path_entity')), true) }}"
          artifact_public_path: "{{ artifact_public_path | default(states(states('input_text.hip_registry_snapshot_public_path_entity')), true) }}"

  hip_retention_policy:
    alias: HIP Retention Policy
    mode: queued
    fields:
      artifact_path:
        required: false
      artifact_public_path:
        required: false
    sequence:
      - action: input_text.set_value
        target:
          entity_id: "{{ states('input_text.hip_registry_artifact_retention_policy_entity') }}"
        data:
          value: overwrite_latest
      - action: input_text.set_value
        target:
          entity_id: "{{ states('input_text.hip_registry_last_event_artifact_entity') }}"
        data:
          value: "{{ artifact_path | default(states(states('input_text.hip_registry_snapshot_artifact_path_entity')), true) }}"
      - action: input_text.set_value
        target:
          entity_id: "{{ states('input_text.hip_registry_last_event_artifact_public_entity') }}"
        data:
          value: "{{ artifact_public_path | default(states(states('input_text.hip_registry_snapshot_public_path_entity')), true) }}"

  hip_event_dispatch:
    alias: HIP Event Dispatch
    mode: queued
    fields:
      event_id:
        required: true
      contract_version:
        required: true
      event_type:
        required: true
      source:
        required: true
      message:
        required: true
      occurred_at:
        required: true
      lifecycle:
        required: true
      camera:
        required: false
      person:
        required: false
      timestamp:
        required: false
      artifact_path:
        required: false
      artifact_public_path:
        required: false
    sequence:
      - action: script.hip_notify_doorbell
        data:
          event_id: "{{ event_id }}"
          contract_version: "{{ contract_version }}"
          event_type: "{{ event_type }}"
          source: "{{ source }}"
          message: "{{ message }}"
          occurred_at: "{{ occurred_at }}"
          lifecycle: "{{ lifecycle }}"
          camera: "{{ camera | default('Front Door', true) }}"
          person: "{{ person | default('', true) }}"
          timestamp: "{{ timestamp | default(occurred_at, true) }}"
          snapshot: "{{ artifact_public_path | default('', true) }}"
          artifact_path: "{{ artifact_path | default('', true) }}"
          artifact_public_path: "{{ artifact_public_path | default('', true) }}"
      - action: script.hip_homepod_announce
        data:
          event_id: "{{ event_id }}"
          contract_version: "{{ contract_version }}"
          event_type: "{{ event_type }}"
          source: "{{ source }}"
          message: "{{ message }}"
          occurred_at: "{{ occurred_at }}"
          lifecycle: "{{ lifecycle }}"
          camera: "{{ camera | default('Front Door', true) }}"
          person: "{{ person | default('', true) }}"
          timestamp: "{{ timestamp | default(occurred_at, true) }}"
          snapshot: "{{ artifact_public_path | default('', true) }}"
          artifact_path: "{{ artifact_path | default('', true) }}"
          artifact_public_path: "{{ artifact_public_path | default('', true) }}"
      - action: script.hip_log_event
        data:
          event_id: "{{ event_id }}"
          contract_version: "{{ contract_version }}"
          event_type: "{{ event_type }}"
          source: "{{ source }}"
          occurred_at: "{{ occurred_at }}"
          lifecycle: "{{ lifecycle }}"
          artifact_path: "{{ artifact_path | default('', true) }}"
          artifact_public_path: "{{ artifact_public_path | default('', true) }}"
          message: "{{ message }}"

  hip_event_log:
    alias: HIP Event Log
    mode: queued
    fields:
      event:
        required: false
      message:
        required: false
      event_id:
        required: false
      contract_version:
        required: false
      event_type:
        required: false
      source:
        required: false
      occurred_at:
        required: false
      lifecycle:
        required: false
      artifact_path:
        required: false
      artifact_public_path:
        required: false
    sequence:
      - variables:
          resolved_event: >-
            {{ event | default(message, true) | default('HIP event', true) }}
      - action: input_text.set_value
        target:
          entity_id: "{{ states('input_text.hip_registry_last_event_entity') }}"
        data:
          value: "{{ resolved_event }}"
      - action: logbook.log
        data:
          name: HIP
          message: "{{ resolved_event }}"

  hip_log_event:
    alias: HIP Log Event
    mode: queued
    fields:
      message:
        required: false
      event:
        required: false
      event_id:
        required: false
      contract_version:
        required: false
      event_type:
        required: false
      source:
        required: false
      occurred_at:
        required: false
      lifecycle:
        required: false
      artifact_path:
        required: false
      artifact_public_path:
        required: false
    sequence:
      - action: script.hip_event_log
        data:
          event: "{{ event | default(message, true) | default('HIP event', true) }}"
